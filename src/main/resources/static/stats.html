<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MTS-LSMS - 统计分析</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #2c3e50; }
        .panel { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .chart-box { height: 320px; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
    <div class="container d-flex justify-content-between">
        <span class="navbar-brand mb-0 h1">🛡️ MTS-LSMS 多终端安全监测系统</span>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" href="/index.html">首页</a>
            <a class="btn btn-outline-light btn-sm" href="/events.html">事件列表</a>
            <a class="btn btn-light btn-sm" href="/stats.html">统计分析</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row g-3">
        <div class="col-md-8">
            <div class="panel p-3">
                <h5 class="mb-2">近7日日志趋势</h5>
                <div id="trendChart" class="chart-box"></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="panel p-3">
                <h5 class="mb-2">事件等级分布</h5>
                <div id="levelChart" class="chart-box"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const trendChart = echarts.init(document.getElementById('trendChart'));
    const levelChart = echarts.init(document.getElementById('levelChart'));

    async function refreshStats() {
        const [trendRes, levelsRes] = await Promise.all([
            fetch('/api/stats/trend?days=7'),
            fetch('/api/stats/event-levels?days=7')
        ]);
        const trend = await trendRes.json();
        const levels = await levelsRes.json();

        trendChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: trend.map(i => i.date) },
            yAxis: { type: 'value' },
            series: [{
                name: '日志数量',
                type: 'line',
                smooth: true,
                areaStyle: {},
                data: trend.map(i => i.count)
            }]
        });

        levelChart.setOption({
            tooltip: { trigger: 'item' },
            series: [{
                name: '事件等级',
                type: 'pie',
                radius: ['40%', '70%'],
                data: levels.map(i => ({ name: i.level, value: i.count }))
            }]
        });
    }

    refreshStats();
    setInterval(refreshStats, 10000);
</script>
</body>
</html>
