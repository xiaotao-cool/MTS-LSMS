<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MTS-LSMS - 事件列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #2c3e50; }
        .panel { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .badge-HIGH { background-color: #dc3545; }
        .badge-MEDIUM { background-color: #ffc107; color: #000; }
        .badge-LOW { background-color: #17a2b8; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
    <div class="container d-flex justify-content-between">
        <span class="navbar-brand mb-0 h1">🛡️ MTS-LSMS 多终端安全监测系统</span>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" href="/index.html">首页</a>
            <a class="btn btn-light btn-sm" href="/events.html">事件列表</a>
            <a class="btn btn-outline-light btn-sm" href="/stats.html">统计分析</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="panel p-4">
        <h4 class="mb-3">安全事件列表</h4>
        <table class="table table-hover">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>等级</th>
                <th>描述</th>
                <th>时间</th>
            </tr>
            </thead>
            <tbody id="eventBody"></tbody>
        </table>
        <div class="d-flex justify-content-between align-items-center mt-2">
            <span id="eventPageInfo" class="text-muted small">第 1 页 / 共 1 页（0 条）</span>
            <div class="btn-group">
                <button id="eventPrev" class="btn btn-outline-primary btn-sm">上一页</button>
                <button id="eventNext" class="btn btn-outline-primary btn-sm">下一页</button>
            </div>
        </div>
    </div>
</div>

<script>
    const pagination = { page: 0, size: 12, totalPages: 1, totalElements: 0 };

    function levelBadge(level) {
        const value = (level || 'LOW').toUpperCase();
        return `<span class="badge badge-${value}">${value}</span>`;
    }

    async function fetchEvents() {
        const params = new URLSearchParams({
            page: String(pagination.page),
            size: String(pagination.size),
            sort: 'time,desc'
        });
        const response = await fetch(`/api/events?${params.toString()}`);
        const data = await response.json();
        pagination.totalPages = Math.max(data.totalPages || 1, 1);
        pagination.totalElements = data.totalElements || 0;

        const tbody = document.getElementById('eventBody');
        tbody.innerHTML = (data.content || []).map(event => `
            <tr>
                <td>${event.id ?? '-'}</td>
                <td>${levelBadge(event.level)}</td>
                <td>${event.description || ''}</td>
                <td class="text-muted small">${event.time ? new Date(event.time).toLocaleString() : '-'}</td>
            </tr>
        `).join('');
        if (!data.content || !data.content.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">暂无安全事件</td></tr>';
        }
        updatePage();
    }

    function updatePage() {
        document.getElementById('eventPageInfo').innerText =
            `第 ${pagination.page + 1} 页 / 共 ${pagination.totalPages} 页（${pagination.totalElements} 条）`;
        document.getElementById('eventPrev').disabled = pagination.page <= 0;
        document.getElementById('eventNext').disabled = pagination.page >= pagination.totalPages - 1;
    }

    document.getElementById('eventPrev').addEventListener('click', () => {
        if (pagination.page > 0) {
            pagination.page -= 1;
            fetchEvents();
        }
    });
    document.getElementById('eventNext').addEventListener('click', () => {
        if (pagination.page < pagination.totalPages - 1) {
            pagination.page += 1;
            fetchEvents();
        }
    });

    fetchEvents();
    setInterval(fetchEvents, 8000);
</script>
</body>
</html>
