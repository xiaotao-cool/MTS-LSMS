# 3. JPA / Hibernate ??
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# 4. Security monitoring rules (configurable thresholds)
security.rule.login-fail.window-minutes=5
security.rule.login-fail.threshold=5
security.rule.high-frequency.window-minutes=1
security.rule.high-frequency.threshold=20
security.rule.illegal-ip-list=10.10.10.10,123.123.123.123,45.145.67.89
security.rule.cross-terminal-fail-spread.window-minutes=10
security.rule.cross-terminal-fail-spread.terminal-threshold=3
security.rule.cross-terminal-fail-spread.cooldown-minutes=10
security.rule.terminal-offline.enabled=true
security.rule.terminal-offline.threshold-minutes=5
security.rule.terminal-offline.cooldown-minutes=10
security.rule.terminal-offline.scan-interval-seconds=60

# 5. File collection via WatchService
security.watch.enabled=true
security.watch.dir=logs
security.watch.default-type=system
security.watch.scan-on-start=true
security.watch.extensions=.log,.txt
